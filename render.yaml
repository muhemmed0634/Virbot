services:
  - type: web
    name: virbot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node --max-old-space-size=384 index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.20.2
      - key: PORT
        value: 10000
